<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Journal</title>
  <link rel="stylesheet" href="/assets/css/post.css" />
  <link rel="icon" type="image/png" href="/assets/images/mandelbrot.webp">

  <!-- Prism.js for syntax highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.css" />

  <script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>

<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}</script>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/assets/css/theme.css">
</head>
<body>
  <div id="scrollProgress"></div>
    <div class="page-wrapper" id="whole-content">
      <header class="Navbar">
        <div id = "Navbar-left">
          <a class='links' href="/"><div class="hover-text" id = "Navbar-home">dhananjaya</div></a>
        </div>
        <div id = "Navbar-right" >
          <a class='links' href="/blogs"><div class="hover-text" id = "Navbar-blogs">blogs</div></a>
          <a class='links' href="/journal"><div class="hover-text" id="Navbar-diary">journal</div></a>
          <a class='links' href="/me"><div class="hover-text" id="Navbar-diary">me</div></a>
        </div>
      </header> 

      <!-- Hamburger Menu Button -->
      <button class="toc-button" id="tocButton" aria-label="Open contents">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>

      <!-- Table of Contents Menu -->
      <nav class="toc-menu" id="tocMenu">
        <div class="toc-header">
          <h3>Contents</h3>
          <button class="toc-close" id="tocClose" aria-label="Close contents">&times;</button>
        </div>
        <ul class="toc-list" id="tocList">
          <!-- Will be populated by JavaScript -->
        </ul>
      </nav>
      
      <div class="content-wrapper">
        <div class="content-header">
          <div class="content-title">{{ page.title }}</div>
          <div class="content-meta">
            <span class="content-date">{{ page.date | date: "%-d %B, %Y" }}</span>
            <span class="meta-divider">•</span>
            {% assign words = content | number_of_words %}
            {% assign read_time = words | divided_by: 200 %}
            {% if read_time == 0 %}{% assign read_time = 1 %}{% endif %}
            <span class="content-read-time">{{ read_time }} min read</span>
          </div>
        </div>

        <div class="content-body" id="content-body">
          {{ content }}
        </div>

        <div class="comments-section">
          <script src="https://giscus.app/client.js"
                  data-repo="thelastone07/thelastone07.github.io"
                  data-repo-id="R_kgDOM4RbYg"
                  data-category="General"
                  data-category-id="DIC_kwDOM4RbYs4CxbcN"
                  data-mapping="pathname"
                  data-strict="0"
                  data-reactions-enabled="1"
                  data-emit-metadata="0"
                  data-input-position="top"
                  data-theme="catppuccin_latte"
                  data-lang="en"
                  data-loading="lazy"
                  crossorigin="anonymous"
                  async>
          </script>
        </div>
      </div>


</div>
        <script src="/assets/js/hover_script.js"></script>
        <script src="/assets/js/progress_bar.js"></script>
        <script src="/assets/js/toc.js"></script>

        <!-- Prism.js scripts -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-rust.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-c.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-cpp.min.js"></script>
        <script src="/assets/js/code-copy.js"></script>

<script src="/assets/js/theme.js"></script>
</body>
</html>
