<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://c.webfontfree.com/c.js?f=SuisseIntl-Regular" type="text/javascript"></script>
<title>Journal</title>
  <link rel="stylesheet" href="/assets/css/post.css" />
  <link rel="icon" type="image/png" href="/assets/images/mandelbrot.webp">
  <link href="https://fonts.googleapis.com/css2?family=Nunito&display=swap" rel="stylesheet">

  <script>
  window.MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']]
    }
  };
</script>

<script type="text/javascript" id="MathJax-script" async
  src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
</script>


</head>
<body>
  <div id="scrollProgress"></div>
    <div class="page-wrapper" id="whole-content">
      <header class="Navbar">
        <div id = "Navbar-left">
          <a class='links' href="/"><div class="hover-text" id = "Navbar-home">dhananjaya</div></a>
        </div>
        <div id = "Navbar-right" >
          <a class='links' href="/blogs"><div class="hover-text" id = "Navbar-blogs">blogs</div></a>
          <a class='links' href="/journal"><div class="hover-text" id="Navbar-diary">journal</div></a>
          <a class='links' href="/me"><div class="hover-text" id="Navbar-diary">me</div></a>
        </div>
      </header> 

      <button class="back-button" onclick="window.history.back();" aria-label="Go back">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <circle cx="11" cy="11" r="11" fill="white"/>
          <polyline points="13,7 9,11 13,15" fill="none" stroke="#D11A2A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      
      <div class="content-wrapper">
        <div class="content-header">
          <div class="content-title">{{ page.title }}</div>
          <div class="content-categories">
            {% for category in page.categories %}
              <span class="category">{{ category }}</span>
            {% endfor %}
          </div>
          <div class="content-excerpt">{{ page.excerpt }}</div>
        </div>
      
        <div class="content-body" id="content-body">
          {{ content }}
        </div>
      </div>
      
      <button id="goTopBtn" title="Go to top">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
        <path d="M342.6 81.4C330.1 68.9 309.8 68.9 297.3 81.4L137.3 241.4C124.8 253.9 124.8 274.2 137.3 286.7C149.8 299.2 170.1 299.2 182.6 286.7L288 181.3L288 552C288 569.7 302.3 584 320 584C337.7 584 352 569.7 352 552L352 181.3L457.4 286.7C469.9 299.2 490.2 299.2 502.7 286.7C515.2 274.2 515.2 253.9 502.7 241.4L342.7 81.4z"/></svg>
      </button>

</div>
        <script src="/assets/js/hover_script.js"></script>
        <script src="/assets/js/progress_bar.js"></script>
      
</body>
</html>
