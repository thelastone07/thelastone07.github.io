<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schrödinger's Cat</title>
  <link rel="stylesheet" href="https://example-font-host.com/suisseintl-webxl.css">
  <style>
    :root {
      --color-black: #161616;
      --color-white: #fff;
      --size: 170px;
    }

    body, html {
      height: 100%;
      margin: 0;
      background: var(--color-black);
      font-family : 'Suisseintl Webxl', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }

    .quote {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      color : var(--color-white);
      
    }

    .hover-text {
        font-size : 1rem;
        color : rgb(154, 154, 154);
      }
    .hover-text:hover {
      text-decoration: underline;
    }

    .cat {
      position: relative;
      height: var(--size);
      width: calc(var(--size) * 1.13);
      margin-bottom: 2rem;
      margin-top : 5rem;
    }

    /* Ears */
    .ear {
      position: absolute;
      top: -30%;
      height: 60%;
      width: 25%;
      background: var(--color-white);
    }

    .ear::before,
    .ear::after {
      content: '';
      position: absolute;
      bottom: 24%;
      height: 10%;
      width: 5%;
      border-radius: 50%;
      background: var(--color-black);
    }

    .ear--left {
      left: -7%;
      border-radius: 70% 30% 0% 0% / 100% 100% 0% 0%;
      transform: rotate(-15deg);
    }

    .ear--left::before,
    .ear--left::after {
      right: 10%;
    }

    .ear--left::after {
      transform: rotate(-45deg);
    }

    .ear--right {
      right: -7%;
      border-radius: 30% 70% 0% 0% / 100% 100% 0% 0%;
      transform: rotate(15deg);
    }

    .ear--right::before,
    .ear--right::after {
      left: 10%;
    }

    .ear--right::after {
      transform: rotate(45deg);
    }

    /* Face */
    .face {
      position: absolute;
      height: 100%;
      width: 100%;
      background: var(--color-black);
      border-radius: 50%;
    }

    /* Eyes */
    .eye {
      position: absolute;
      top: 35%;
      height: 30%;
      width: 31%;
      background: var(--color-white);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      overflow: hidden;
    }

    .eye::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 0;
      width: 100%;
      border-radius: 0 0 50% 50% / 0 0 40% 40%;
      background: var(--color-black);
      animation: blink 4s infinite ease-in;
    }

    .eye::before {
      content: '';
      position: absolute;
      top: 60%;
      height: 10%;
      width: 15%;
      background: var(--color-white);
      border-radius: 50%;
    }

    .eye--left {
      left: 0;
    }

    .eye--left::before {
      right: -5%;
    }

    .eye--right {
      right: 0;
    }

    .eye--right::before {
      left: -5%;
    }

    /* Pupils */
    .eye-pupil {
      position: absolute;
      top: 25%;
      height: 50%;
      width: 20%;
      background: var(--color-black);
      border-radius: 50%;
      animation: look-around 4s infinite;
    }

    .eye--left .eye-pupil {
      right: 30%;
    }

    .eye--right .eye-pupil {
      left: 30%;
    }

    .eye-pupil::after {
      content: '';
      position: absolute;
      top: 30%;
      right: -5%;
      height: 20%;
      width: 35%;
      border-radius: 50%;
      background: var(--color-white);
    }

    /* Muzzle */
    .muzzle {
      position: absolute;
      top: 60%;
      left: 50%;
      height: 6%;
      width: 10%;
      background: var(--color-white);
      transform: translateX(-50%);
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    }

    /* Animations */
    @keyframes blink {
      0%, 90% {
        height: 0;
      }
      92.5%, 97.5% {
        height: 100%;
      }
      95%, 100% {
        height: 0;
      }
    }

    @keyframes look-around {
      0% { transform: translate(0); }
      5% { transform: translate(50%, -25%); }
      10% { transform: translate(50%, -25%); }
      15% { transform: translate(-100%, -25%); }
      20% { transform: translate(-100%, -25%); }
      25%, 100% { transform: translate(0); }
    }

    

    @media (max-width: 500px) {
      :root {
        --size: 120px;
      }

    }
  </style>
</head>
<body>
  <div class="quote">404: this page existed and didn't</div>

  <div class="cat">
    <div class="ear ear--left"></div>
    <div class="ear ear--right"></div>
    <div class="face">
      <div class="eye eye--left">
        <div class="eye-pupil"></div>
      </div>
      <div class="eye eye--right">
        <div class="eye-pupil"></div>
      </div>
      <div class="muzzle"></div>
    </div>
  </div>

  <div class="hover-text" onclick="location.href='/'">home</div>
</body>
</html>

<script>
function get_index(n) {
    while (true) {
        var perm = Array.from({ length: n }, (_, i) => i);

        for (let i = perm.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * i);
            [perm[i], perm[j]] = [perm[j], perm[i]];
        }

        let isDeranged = true;
        for (let i = 0; i < n; i++) {
            if (perm[i] === i) {
                isDeranged = false;
                break;
            }
        }
        if (isDeranged) {
            return perm;
        }
    }
}

const hoverElements = document.querySelectorAll('.hover-text');
const TIMEOUT = 120;
hoverElements.forEach(el => {
    el.dataset.original = el.textContent;

    el.addEventListener('mouseenter', () => {
        el.style.color = 'red';
        el.style.cursor = 'pointer';
        const originalText = el.dataset.original;
        const index = get_index(originalText.length);
        //scramble the current text once
        let currentText = originalText;
        let scrambledText = currentText.split('').map((char, i) => {
            return currentText[index[i]];
        }).join('');
        //set the scrambled text to the element
        el.textContent = scrambledText;
        currentText = scrambledText;
        //set timeout
        setTimeout(() => {
            //scramble the text again
            scrambledText = currentText.split('').map((char, i) => {
                return currentText[index[i]];
            }).join('');
            //set the scrambled text to the element
            el.textContent = scrambledText;
            setTimeout(()=> {
                //set the original text to the element
                el.textContent = originalText;
            },TIMEOUT);

        }, TIMEOUT);
    }); 
      el.addEventListener('mouseleave', () => {
        el.style.color = '';
        el.style.cursor = '';
      });
});





</script>
