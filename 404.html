<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Schrödinger's Cat</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat&family=Dancing+Script&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-black: #161616;
      --color-white: #fff;
      --size: 170px;
    }

    body, html {
      height: 100%;
      margin: 0;
      background: var(--color-black);
      color: var(--color-white);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1rem;
    }

    .quote {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
    }

    .cat {
      position: relative;
      height: var(--size);
      width: calc(var(--size) * 1.13);
      margin-bottom: 2rem;
      margin-top : 5rem;
    }

    /* Ears */
    .ear {
      position: absolute;
      top: -30%;
      height: 60%;
      width: 25%;
      background: var(--color-white);
    }

    .ear::before,
    .ear::after {
      content: '';
      position: absolute;
      bottom: 24%;
      height: 10%;
      width: 5%;
      border-radius: 50%;
      background: var(--color-black);
    }

    .ear--left {
      left: -7%;
      border-radius: 70% 30% 0% 0% / 100% 100% 0% 0%;
      transform: rotate(-15deg);
    }

    .ear--left::before,
    .ear--left::after {
      right: 10%;
    }

    .ear--left::after {
      transform: rotate(-45deg);
    }

    .ear--right {
      right: -7%;
      border-radius: 30% 70% 0% 0% / 100% 100% 0% 0%;
      transform: rotate(15deg);
    }

    .ear--right::before,
    .ear--right::after {
      left: 10%;
    }

    .ear--right::after {
      transform: rotate(45deg);
    }

    /* Face */
    .face {
      position: absolute;
      height: 100%;
      width: 100%;
      background: var(--color-black);
      border-radius: 50%;
    }

    /* Eyes */
    .eye {
      position: absolute;
      top: 35%;
      height: 30%;
      width: 31%;
      background: var(--color-white);
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      overflow: hidden;
    }

    .eye::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 0;
      width: 100%;
      border-radius: 0 0 50% 50% / 0 0 40% 40%;
      background: var(--color-black);
      animation: blink 4s infinite ease-in;
    }

    .eye::before {
      content: '';
      position: absolute;
      top: 60%;
      height: 10%;
      width: 15%;
      background: var(--color-white);
      border-radius: 50%;
    }

    .eye--left {
      left: 0;
    }

    .eye--left::before {
      right: -5%;
    }

    .eye--right {
      right: 0;
    }

    .eye--right::before {
      left: -5%;
    }

    /* Pupils */
    .eye-pupil {
      position: absolute;
      top: 25%;
      height: 50%;
      width: 20%;
      background: var(--color-black);
      border-radius: 50%;
      animation: look-around 4s infinite;
    }

    .eye--left .eye-pupil {
      right: 30%;
    }

    .eye--right .eye-pupil {
      left: 30%;
    }

    .eye-pupil::after {
      content: '';
      position: absolute;
      top: 30%;
      right: -5%;
      height: 20%;
      width: 35%;
      border-radius: 50%;
      background: var(--color-white);
    }

    /* Muzzle */
    .muzzle {
      position: absolute;
      top: 60%;
      left: 50%;
      height: 6%;
      width: 10%;
      background: var(--color-white);
      transform: translateX(-50%);
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
    }

    /* Animations */
    @keyframes blink {
      0%, 90% {
        height: 0;
      }
      92.5%, 97.5% {
        height: 100%;
      }
      95%, 100% {
        height: 0;
      }
    }

    @keyframes look-around {
      0% { transform: translate(0); }
      5% { transform: translate(50%, -25%); }
      10% { transform: translate(50%, -25%); }
      15% { transform: translate(-100%, -25%); }
      20% { transform: translate(-100%, -25%); }
      25%, 100% { transform: translate(0); }
    }

    /* Button */
    .home-btn {
      padding: 0.75rem 1.5rem;
      height: 3rem;
      width: 15rem;
      font-size: 1rem;
      color: #DC143C;
      background: var(--color-white);
      border: none;
      border-radius: 2rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .home-btn:hover {
      background: #e5e5e5;
      transform: scale(1.05);
    }

    @media (max-width: 500px) {
      :root {
        --size: 120px;
      }

      .quote {
  font-size: 1.2rem;
  margin-bottom: 3rem; /* or more, if you want even more spacing */
}


      .home-btn {
        font-size: 0.9rem;
        padding: 0.5rem 1.2rem;
      }
    }
  </style>
</head>
<body>
  <div class="quote">404: this page existed and didn't</div>

  <div class="cat">
    <div class="ear ear--left"></div>
    <div class="ear ear--right"></div>
    <div class="face">
      <div class="eye eye--left">
        <div class="eye-pupil"></div>
      </div>
      <div class="eye eye--right">
        <div class="eye-pupil"></div>
      </div>
      <div class="muzzle"></div>
    </div>
  </div>

  <button class="home-btn" onclick="location.href='/'">Return to Reality</button>
</body>
</html>
